[project]
name = "repo-context-workbench"
version = "0.1.0"
description = "Repo Context Workbench — group your repos, turn each group into context for your agents"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
ctx = "repo_context.cli:main"

[project.optional-dependencies]
app = ["pywebview>=5"]  # 桌面視窗模式（`ctx app`）；引擎本體零 GUI 依賴

[tool.pytest.ini_options]
markers = [
    "e2e: CLI subprocess end-to-end tests",
    "agent: needs a logged-in claude CLI (manual/L3)",
]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["repo_context*"]

[tool.setuptools.package-data]
repo_context = ["*.html", "static/*", "assets/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
