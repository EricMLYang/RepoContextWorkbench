# CI：README「驗證（改完必跑）」那一串，push／PR 自動跑。
# - macOS：完整驗證（Rust 測試＋clippy＋fmt＋與 Python 版對拍＋前端）。桌面殼在 workspace 裡，
#   編譯時要有 desktop/dist，所以先 build 前端。
# - Windows：先只確認 ctx 編得過（AGENTS.md：Windows／VDI 每個功能都要註明測過沒有；
#   測試還有 Unix 專屬的部分，先不擋 merge）。
name: CI

on:
  push:
    branches: [main, rust-desktop]
  pull_request:

# 只讀權限；actions 釘 commit SHA（供應鏈：tag 可以被改指）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REPOCTX_NO_BACKGROUND: "1"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: git 身分（spine commit 的測試要用）
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: 前端
        working-directory: desktop
        run: |
          npm ci
          npm run build
          npm test
          npm run lint
          npm run format:check
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: 對拍（Python 版是規格）
        run: |
          pip install -e .
          cargo build -p ctx-cli
          bash scripts/parity.sh
          python3 scripts/parity_state.py

  windows-build:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build ctx
        run: cargo build -p ctx-cli
