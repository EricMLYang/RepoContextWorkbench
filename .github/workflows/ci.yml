# CI：README「驗證（改完必跑）」那一串，push／PR 自動跑。
# - macOS：完整驗證（Rust 測試＋clippy＋fmt＋與 Python 版對拍＋前端）。桌面殼在 workspace 裡，
#   編譯時要有 desktop/dist，所以先 build 前端。
# - Windows：先只確認 ctx 編得過（AGENTS.md：Windows／VDI 每個功能都要註明測過沒有；
#   測試還有 Unix 專屬的部分，先不擋 merge）。
name: CI

on:
  push:
    branches: [main, rust-desktop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REPOCTX_NO_BACKGROUND: "1"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git 身分（spine commit 的測試要用）
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: 前端
        working-directory: desktop
        run: |
          npm ci
          npm run build
          npm test
          npm run lint
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: 對拍（Python 版是規格）
        run: |
          pip install -e .
          cargo build -p ctx-cli
          bash scripts/parity.sh
          python3 scripts/parity_state.py

  windows-build:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build ctx
        run: cargo build -p ctx-cli
