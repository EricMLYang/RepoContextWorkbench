[package]
name = "ctx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ctx 指令：CLI＋MCP server＋Claude Code hooks"

[lib]
name = "ctx_cli"
path = "src/lib.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
ctx-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
# CLI 解析：derive 寫法，子命令／旗標一對一照 argparse（AGENTS.md 點名的主流 crate）
clap = { version = "4", features = ["derive"] }
# `ctx timer` 前景跑時接 Ctrl+C：跨平台（macOS＋Windows VDI 都要），比 signal-hook 少寫一層
# 平台分支；只需要「收到中斷 → 送一個停止訊號給 run_loop」這一件事
ctrlc = "3"


[target.'cfg(unix)'.dependencies]
# 恢復 SIGPIPE 預設（輸出被 `| head` 截斷時安靜結束，不 panic）；workspace 既有依賴
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_yaml.workspace = true
ctx-core = { path = "../ctx-core", features = ["testkit"] }
