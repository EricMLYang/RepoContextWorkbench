<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>repo 工作台</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
  /* ── 色彩語意表（2026-09-02 檢討 F7）：紅＝准打斷（只此一處）、琥珀＝要判斷、
       藍＝資訊／碰撞回程、綠＝正常、紫＝處理中、灰＝其餘。 ── */
  :root{
    --bg:#15171c;--panel:#1c1f26;--panel2:#242832;--panel3:#2b3040;--line:#2e3340;--line2:#3a4050;
    --ink:#e2e5ea;--ink2:#aab0bd;--sub:#7d8494;--dim:#5b6170;
    --red:#e5484d;--amber:#e0a24c;--blue:#6fa4e8;--green:#7fbf7f;--violet:#a98be8;
    --termh:260px;--sidew:290px;
    --f0:12px;--f1:13px;--f2:14.5px;--f3:17px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
       font:var(--f1)/1.55 "Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
       display:grid;
       grid-template:"top top" 46px "side main" 1fr "side term" var(--termh) "status status" 24px
                     / var(--sidew) 1fr;}
  button,input,select{font:inherit;border:1px solid var(--line2);border-radius:6px;
       background:var(--panel2);color:var(--ink);padding:4px 10px;line-height:1.35}
  button{cursor:pointer;transition:border-color .12s,background .12s,color .12s}
  button:hover{border-color:var(--blue);color:#fff;background:var(--panel3)}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:none;border-color:transparent;color:var(--ink2)}
  button.ghost:hover{border-color:var(--line2);background:var(--panel2)}
  button.icon{padding:2px 6px;font-size:var(--f0)}
  button.primary{background:#2d4f80;border-color:#3a6bb0;color:#fff}
  button.primary:hover{background:#376099}
  input::placeholder{color:var(--dim)}
  input:focus,select:focus{outline:none;border-color:var(--blue)}
  h2{font-size:11px;margin:0;color:var(--sub);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  .muted{color:var(--sub)}
  .kbd{font:11px Consolas,monospace;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--ink2)}

  /* ── topbar ── */
  #top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;
       background:var(--panel);border-bottom:1px solid var(--line)}
  #logo{font-weight:700;font-size:var(--f2);white-space:nowrap;letter-spacing:.02em}
  #logo small{font-weight:400;color:var(--sub);font-size:var(--f0);margin-left:6px}
  #scopepill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
       border-radius:14px;padding:2px 10px;color:var(--ink2);font-size:var(--f0);max-width:340px;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #scopepill b{color:var(--ink);font-weight:600}
  #topspacer{flex:1}
  #badge{background:var(--amber);color:#1b1d23;border-radius:10px;padding:0 8px;
         font-size:var(--f0);font-weight:600;line-height:20px;display:none;white-space:nowrap}
  #badge.hot{background:var(--red);color:#fff}

  /* ── sidebar：牌＋會話 ── */
  #side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
        overflow-y:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:16px}
  .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 2px}
  .deck{display:flex;flex-direction:column;gap:4px}
  .gcard{border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:7px 9px;
         cursor:pointer;transition:border-color .12s}
  .gcard:hover{border-color:var(--line2)}
  .gcard.on{border-color:var(--blue);background:#222a3a}
  .gcard .ghead{display:flex;align-items:center;gap:7px}
  .gcard .gname{flex:1;font-weight:600;font-size:var(--f1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gcard .gname .cnt{color:var(--sub);font-weight:400;margin-left:5px;font-size:var(--f0)}
  .gcard .gbadges{display:inline-flex;gap:5px;align-items:center}
  .gb{font-size:11px;border-radius:9px;padding:0 6px;line-height:16px;white-space:nowrap}
  .gb.amber{background:#3c3120;color:var(--amber)}
  .gb.red{background:#3c2224;color:var(--red)}
  .gb.violet{background:#2d2740;color:var(--violet)}
  .gb.blue{background:#22304a;color:var(--blue)}
  .gcard .chev{color:var(--dim);font-size:11px;transition:transform .12s;width:12px;text-align:center}
  .gcard.open .chev{transform:rotate(90deg)}
  .members{display:none;margin-top:6px;border-top:1px solid var(--line);padding-top:5px;flex-direction:column;gap:1px}
  .gcard.open .members{display:flex}
  .mrow{display:flex;align-items:center;gap:6px;padding:2px 2px 2px 0;border-radius:4px;font-size:var(--f0)}
  .mrow:hover{background:var(--panel3)}
  .mrow input{margin:0 2px 0 0}
  .mrow .mid{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
  .mrow.off .mid{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2)}
  .mrow .tier{width:6px;height:6px;border-radius:50%;flex:none}
  .tier.active{background:var(--green)}.tier.paused{background:var(--amber)}
  .tier.dormant{background:var(--dim)}.tier.archived{background:transparent;border:1px solid var(--dim)}
  .mrow .mst{display:inline-flex;gap:6px;color:var(--sub);white-space:nowrap;font-size:11px}
  .mrow .mst .bad{color:var(--amber)}
  .mrow .mst .bot{color:var(--blue)}
  .mrow .go{visibility:hidden;padding:0 5px;font-size:11px}
  .mrow:hover .go{visibility:visible}
  .sessions{display:flex;flex-direction:column;gap:3px}
  .srow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer;
        border:1px solid transparent;font-size:var(--f0)}
  .srow:hover{background:var(--panel2)}
  .srow.on{border-color:var(--line2);background:var(--panel2)}
  .srow .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
  .srow.dead .dot{background:var(--dim)}
  .srow .stitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .srow.dead .stitle{color:var(--sub);text-decoration:line-through}
  .srow .sorigin{color:var(--dim);font-size:11px;white-space:nowrap}
  .srow .x{color:var(--dim);padding:0 3px}
  .srow .x:hover{color:var(--red)}
  #auditbox{font-size:var(--f0);color:var(--sub);display:flex;flex-direction:column;gap:3px}
  #auditbox .red{color:var(--red)}
  #auditbox .okline{color:var(--green)}

  /* ── main：收件匣 ── */
  #main{grid-area:main;overflow-y:auto;padding:14px 22px 28px}
  #mainin{max-width:900px;margin:0 auto}
  #collidebox{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  #idea{flex:1;font-size:var(--f2);padding:9px 14px;border-radius:9px;background:var(--panel);
        border:1px solid var(--line2)}
  #idea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2d4f8044}
  #tabs{display:flex;gap:4px;margin-bottom:12px;align-items:center}
  #tabs button{border:none;background:none;color:var(--sub);padding:5px 10px;border-radius:6px;font-size:var(--f1)}
  #tabs button.on{color:var(--ink);background:var(--panel2)}
  #tabs .spacer{flex:1}
  .tabpane{display:none}.tabpane.on{display:block}
  .secttl{display:flex;align-items:center;gap:8px;margin:14px 0 6px;color:var(--sub);font-size:var(--f0);
          letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .secttl .n{color:var(--ink2);font-weight:400}
  .secttl:first-child{margin-top:0}
  .card{display:grid;grid-template-columns:22px 1fr;gap:6px 10px;background:var(--panel);
        border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:8px;
        padding:10px 14px 9px 10px;margin-bottom:7px;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .card.leaving{opacity:0;transform:translateX(12px);transition:all .18s}
  .card .ic{font-size:14px;line-height:1.5;text-align:center;color:var(--sub)}
  .card .ttl{font-size:var(--f2);line-height:1.45;word-break:break-word}
  .card .ttl .verdict{font-weight:700;margin-right:6px}
  .card .meta{color:var(--dim);font-size:11px;white-space:nowrap;margin-left:8px}
  .card .lines{grid-column:2;color:var(--ink2);font-size:var(--f0);white-space:pre-wrap;word-break:break-word}
  .card .lines .k{color:var(--sub)}
  .card .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .card .acts button{font-size:var(--f0);padding:3px 10px}
  .card .acts button.quiet{color:var(--sub);border-color:transparent;background:none}
  .card .acts button.quiet:hover{border-color:var(--line2)}
  .card.interrupt{border-left-color:var(--red);background:#22191b}
  .card.interrupt .ic{color:var(--red)}
  .card.question{border-left-color:var(--amber)}
  .card.question .ic{color:var(--amber)}
  .card.collision{border-left-color:var(--blue)}
  .card.collision .ic{color:var(--blue)}
  .card.pending{border-left-color:var(--violet);opacity:.85}
  .card.pending .ic{color:var(--violet)}
  .card.loop{border-left-color:var(--line2)}
  .card.loop .ic{color:var(--ink2)}
  .card.event{border-left-color:var(--line2)}
  .picker{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--f0)}
  .picker select{font-size:var(--f0);padding:2px 6px}
  #allclear[hidden]{display:none}
  #allclear{display:flex;align-items:center;gap:10px;color:var(--green);font-size:var(--f2);
            padding:26px 4px 10px;justify-content:center}
  #quietline{color:var(--sub);font-size:var(--f0);text-align:center;padding:10px 0 4px}
  #briefdrawer{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
               padding:12px 16px;display:none}
  #briefdrawer pre{margin:0;white-space:pre-wrap;font:inherit;color:var(--ink2)}
  #briefdrawer .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--violet);border-right-color:transparent;
        border-radius:50%;animation:spin .9s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 深看 */
  table{border-collapse:collapse;width:100%;font-size:var(--f0)}
  th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-weight:600;white-space:nowrap}
  td.num,th.num{text-align:right}
  td.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-bottom:12px}
  #statsraw{color:var(--sub);font-size:var(--f0);margin:4px 0 12px}
  .evrow .et{color:var(--blue)}

  /* ── terminal ── */
  #termpanel{grid-area:term;display:flex;flex-direction:column;min-height:0;
             background:#111318;border-top:1px solid var(--line)}
  #termdrag{height:4px;cursor:ns-resize;background:transparent;flex:none}
  #termdrag:hover{background:var(--blue)}
  #termbar{display:flex;align-items:center;gap:8px;padding:3px 12px 5px;flex:none}
  #termbar .tlabel{color:var(--sub);font-size:var(--f0);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  #termtitle{flex:1;color:var(--ink2);font-size:var(--f0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #termtitle b{color:var(--ink);font-weight:600}
  #termbar select,#termbar button{font-size:var(--f0);padding:2px 8px}
  #termbody{flex:1;min-height:0;position:relative;overflow:hidden}
  .termhost{position:absolute;inset:0 0 0 10px;display:none}
  .termhost.on{display:block}
  #termempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
             justify-content:center;color:var(--dim);font-size:var(--f0);gap:4px}

  /* ── status ── */
  #status{grid-area:status;display:flex;align-items:center;gap:18px;
          padding:0 14px;background:var(--panel);border-top:1px solid var(--line);
          color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden}
  #status .spacer{flex:1}
  #toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
         background:#000d;color:#fff;border-radius:7px;padding:8px 16px;font-size:var(--f0);
         opacity:0;transition:opacity .25s;pointer-events:none;max-width:70%;z-index:9}

  /* ── 臨時組對話框 ── */
  #dlg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:8}
  #dlg.on{display:flex}
  #dlgbox{width:520px;max-height:80vh;background:var(--panel);border:1px solid var(--line2);border-radius:10px;
          padding:16px 18px;display:flex;flex-direction:column;gap:10px}
  #dlgbox h3{margin:0;font-size:var(--f2)}
  #dlgtags{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;border:1px solid var(--line2);border-radius:10px;padding:1px 9px;cursor:pointer;
        color:var(--ink2);background:none;display:inline-flex;align-items:center;gap:5px}
  .chip.on{border-color:var(--blue);color:var(--blue)}
  .chip .cdot{width:7px;height:7px;border-radius:50%}
  #dlglist{overflow-y:auto;max-height:44vh;border:1px solid var(--line);border-radius:7px;padding:4px 8px;
           display:flex;flex-direction:column}
  .drow{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:var(--f1)}
  .drow .did{flex:1}
  .drow .dtags{display:inline-flex;gap:4px;flex-wrap:wrap}
  .drow .dtag{font-size:10.5px;border-radius:8px;padding:0 6px;background:var(--panel3);color:var(--ink2)}
  .drow .dtag.editable{cursor:pointer}
  .drow .addtag{font-size:10.5px;color:var(--dim);cursor:pointer;padding:0 4px}
  .drow .addtag:hover{color:var(--blue)}
  #dlgfoot{display:flex;gap:8px;align-items:center}
  #dlgfoot .sp{flex:1}
</style></head><body>

<div id="top">
  <span id="logo">⚙ repo 工作台<small id="ver"></small></span>
  <span id="scopepill" title="目前範圍：收件匣問句／碰撞／會話帶料都以此為界">範圍 <b id="scopename">全部</b></span>
  <span id="topspacer"></span>
  <span id="badge"></span>
  <button id="briefbtn" class="ghost" title="把收件匣此刻的三段存成今日簡報（落 presented 事件）">存成今日簡報</button>
  <button id="ackbtn" class="ghost" title="未讀全部標記已讀（不落 chosen）">全部已讀</button>
  <button id="rescan" class="ghost" title="重跑 P3 採集（git 狀態）">重新採集</button>
</div>

<div id="side">
  <div>
    <div class="sechead"><h2>牌</h2>
      <button id="adhocbtn" class="icon ghost" title="挑幾個 repo 組成臨時組（可存成組）">＋臨時組</button></div>
    <div id="deck" class="deck"></div>
  </div>
  <div>
    <div class="sechead"><h2>會話</h2>
      <span><button id="newshell" class="icon ghost" title="在 spine repo 開 shell">＋shell</button>
      <button id="newagent" class="icon ghost" title="打包目前範圍的文件地圖開 agent 會話">＋agent</button></span></div>
    <div id="sessions" class="sessions"></div>
    <div id="sessempty" class="muted" style="font-size:12px;padding:4px 8px">還沒有會話。卡片上的〔開會話〕〔深撞〕會在這裡開一個有主的會話。</div>
  </div>
  <div>
    <div class="sechead"><h2>稽核</h2><span id="auditcount" class="muted" style="font-size:11px"></span></div>
    <div id="auditbox"></div>
  </div>
</div>

<div id="main"><div id="mainin">
  <div id="collidebox">
    <input id="idea" placeholder="碰撞台：想法丟進來，Enter 送出。判定走回程，回來會出現在收件匣。">
    <button id="collidebtn" class="primary">丟進碰撞</button>
  </div>
  <div id="tabs">
    <button data-tab="inbox" class="on">收件匣</button>
    <button data-tab="deep">深看</button>
    <span class="spacer"></span>
    <span id="scantime" class="muted" style="font-size:11px"></span>
  </div>

  <div id="tab-inbox" class="tabpane on">
    <div id="cards"></div>
    <div id="allclear" hidden>✅ 一切正常。</div>
    <div id="quietline"></div>
    <div id="briefdrawer">
      <div class="bh"><span class="muted" id="brieffile"></span><button class="icon ghost" id="briefclose">收起</button></div>
      <pre id="briefout"></pre>
    </div>
  </div>

  <div id="tab-deep" class="tabpane">
    <div class="secttl">全量狀態 <span class="n" id="deepscope"></span></div>
    <div class="tblwrap"><div id="deeptable"></div></div>
    <div id="statsraw"></div>
    <div class="secttl">最近事件 <span class="n">（脊椎最後 40 則，含自己出手的留痕）</span></div>
    <div class="tblwrap"><div id="recent"></div></div>
  </div>
</div></div>

<div id="termpanel">
  <div id="termdrag" title="拖曳調整終端高度"></div>
  <div id="termbar">
    <span class="tlabel">終端</span>
    <span id="termtitle"></span>
    <select id="agentsel" title="開哪家 agent CLI（config agents: 註冊）"></select>
    <button id="termkill" class="ghost" title="結束目前會話" disabled>結束會話</button>
    <button id="termtoggle" class="ghost" title="收合／展開（Ctrl+`）">收合</button>
  </div>
  <div id="termbody"><div id="termempty">
    <div>沒有選中的會話</div>
    <div>左側「會話」點一個，或從卡片〔開會話〕〔深撞〕開一個有主的會話。<span class="kbd">Ctrl+`</span> 收合</div>
  </div></div>
</div>

<div id="status">
  <span id="scanscope"></span><span id="scanwhen"></span><span id="sesscount"></span>
  <span class="spacer"></span><span id="statsline"></span>
</div>
<div id="toast"></div>

<div id="dlg"><div id="dlgbox">
  <h3>挑一手牌（臨時組）</h3>
  <div id="dlgtags"></div>
  <div id="dlglist"></div>
  <div id="dlgfoot">
    <span id="dlgcount" class="muted" style="font-size:12px"></span>
    <span class="sp"></span>
    <input id="dlgname" placeholder="組名（留空＝只用一次）" style="width:170px">
    <button id="dlgcancel" class="ghost">取消</button>
    <button id="dlgok" class="primary">用這手牌</button>
  </div>
</div></div>

<script src="/static/xterm.js"></script>
<script src="/static/addon-fit.js"></script>
<script>
const $=id=>document.getElementById(id);
const TOKEN=new URLSearchParams(location.search).get("token")||"";
const KINDICON={interrupt:"⚠",question:"?",pending:"◐",collision:"✔",loop:"⏳",event:"•"};
const KINDNAME={interrupt:"准打斷",question:"需要你判斷",pending:"處理中",collision:"碰撞回程",loop:"未結 open loops",event:"其他未讀"};
const KINDORDER=["interrupt","question","pending","collision","event","loop"];

let state={groups:[],repos:[],tiers:{},tags:{},tag_vocab:[],cards:[],terms:[],agents:[],stats:{},recent:[]};
let scan={states:[],question_cards:[],audit:[],quiet:0,group:""};
let scope=loadScope();       // {group:string|null, repos:string[]|null}
let openGroups=new Set(JSON.parse(localStorage.getItem("openGroups")||"[]"));
let lastStates={};

function toast(msg){const t=$("toast");t.textContent=msg;t.style.opacity=1;
  clearTimeout(toast._h);toast._h=setTimeout(()=>t.style.opacity=0,2600);}
async function api(path,opts){
  opts=opts||{};opts.headers=Object.assign({"X-Auth":TOKEN},opts.headers||{});
  const r=await fetch(path,opts);const j=await r.json();
  if(j.error){toast("錯誤："+j.error);throw new Error(j.error);}return j;}
const post=o=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;
  if(text!==undefined&&text!==null)e.textContent=text;return e;}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadScope(){try{const s=JSON.parse(localStorage.getItem("scope")||"null");
  if(s&&typeof s==="object")return s;}catch(e){}return {group:null,repos:null};}

// ── 範圍（牌） ──
function scopeRepos(){
  if(scope.repos&&scope.repos.length)return scope.repos.filter(r=>state.repos.includes(r));
  if(scope.group){const g=state.groups.find(x=>x.name===scope.group);return g?g.members.slice():[];}
  return state.repos.slice();}
function scopePayload(){const p={};
  if(scope.repos&&scope.repos.length)p.repos=scopeRepos();else if(scope.group)p.group=scope.group;return p;}
function scanParam(){const p=scopePayload();
  if(p.repos)return "repos="+encodeURIComponent(p.repos.join(","));
  if(p.group)return "group="+encodeURIComponent(p.group);return "";}
function scopeLabel(){
  if(scope.repos&&scope.repos.length){const g=scope.group?scope.group+" 之 ":"";return g+scope.repos.length+" 個 repo（臨時）";}
  return scope.group||"全部";}
function setScope(s){scope=s;save("scope",scope);$("scopename").textContent=scopeLabel();
  renderDeck();rescan();}

// ── 牌組卡 ──
function repoBad(s){return s&&((s.dirty_days!=null&&s.dirty_days>=4)||!s.exists||s.note||(s.behind||0)>0
  ||(s.tier==="active"&&s.last_commit_days!=null&&s.last_commit_days>=21));}
function groupStats(members){
  let bad=0,bots=0;members.forEach(m=>{const s=lastStates[m];if(repoBad(s))bad++;if(s&&(s.agents||[]).length)bots++;});
  return {bad,bots};}
function tierOf(id){return state.tiers[id]||"active";}
function memberRow(id,gname,inScope){
  const s=lastStates[id];
  const row=el("div","mrow"+(inScope?"":" off"));
  const cb=document.createElement("input");cb.type="checkbox";cb.checked=inScope;cb.title="勾選＝納入範圍（臨時子集）";
  cb.onclick=e=>{e.stopPropagation();
    const g=state.groups.find(x=>x.name===gname);const base=g?g.members:state.repos;
    let cur=(scope.repos&&scope.group===gname)?scope.repos.slice():base.slice();
    if(cb.checked){if(!cur.includes(id))cur.push(id);}else cur=cur.filter(x=>x!==id);
    const full=base.every(b=>cur.includes(b))&&cur.length===base.length;
    setScope({group:gname||null,repos:full?null:cur});};
  row.append(cb);
  const td=el("span","tier "+tierOf(id));td.title="tier："+tierOf(id);row.append(td);
  const mid=el("span","mid",id);mid.title=id+((state.tags[id]||[]).length?"  ·  "+state.tags[id].join("、"):"");row.append(mid);
  const st=el("span","mst");
  if(s){
    if((s.agents||[]).length){const b=el("span","bot","🤖");b.title="agent 在跑："+s.agents.join(",");st.append(b);}
    if(s.dirty){const b=el("span",repoBad(s)?"bad":"","✎"+s.dirty+(s.dirty_days!=null&&s.dirty_days>=1?"·"+s.dirty_days.toFixed(0)+"d":""));b.title="未提交 "+s.dirty+" 檔"+(s.dirty_days!=null?"，最舊 "+s.dirty_days.toFixed(0)+" 天":"");st.append(b);}
    if(s.ahead){const b=el("span","","↑"+s.ahead);b.title="有 commit 沒 push";st.append(b);}
    if(s.behind){const b=el("span","bad","↓"+s.behind);b.title="落後遠端";st.append(b);}
    if(s.worktrees){const b=el("span","","⑂"+s.worktrees);b.title="worktrees";st.append(b);}
    if(s.last_commit_days!=null){const b=el("span",s.tier==="active"&&s.last_commit_days>=21?"bad":"",s.last_commit_days.toFixed(0)+"d");b.title="末次 commit 距今";st.append(b);}
    if(s.note){const b=el("span","bad","!");b.title=s.note;st.append(b);}
  }else st.append(el("span","","…"));
  row.append(st);
  const go=el("button","icon ghost go","▶");go.title="在此 repo 開 agent 會話（帶料）";
  go.onclick=e=>{e.stopPropagation();newTerm("agent",{repo:id,repos:[id],origin:"repo:"+id});};
  row.append(go);
  return row;}
function groupCard(name,members,label){
  const on=(scope.group||null)===(name||null);
  const card=el("div","gcard"+(on?" on":"")+(openGroups.has(name||"*")?" open":""));
  const head=el("div","ghead");
  const chev=el("span","chev","▶");
  chev.onclick=e=>{e.stopPropagation();const k=name||"*";openGroups.has(k)?openGroups.delete(k):openGroups.add(k);
    save("openGroups",[...openGroups]);renderDeck();};
  head.append(chev);
  const nm=el("span","gname",label||name);nm.append(el("span","cnt",members.length+" repo"));head.append(nm);
  const gs=groupStats(members);const bd=el("span","gbadges");
  if(gs.bad){const b=el("span","gb amber",gs.bad+" 異常");b.title="dirty 過期／落後遠端／採集失敗";bd.append(b);}
  if(gs.bots){const b=el("span","gb blue","🤖"+gs.bots);b.title="agent 在跑";bd.append(b);}
  head.append(bd);card.append(head);
  const mem=el("div","members");
  const inScopeSet=new Set(on?scopeRepos():members);
  members.forEach(m=>mem.append(memberRow(m,name,inScopeSet.has(m))));
  card.append(mem);
  card.onclick=()=>{if(on&&!scope.repos){openGroups.has(name||"*")?openGroups.delete(name||"*"):openGroups.add(name||"*");save("openGroups",[...openGroups]);renderDeck();return;}
    setScope({group:name||null,repos:null});};
  return card;}
function renderDeck(){
  const d=$("deck");d.innerHTML="";
  d.append(groupCard(null,state.repos,"（全部）"));
  state.groups.forEach(g=>d.append(groupCard(g.name,g.members)));
  if(scope.repos&&scope.repos.length&&!scope.group){
    const c=groupCard("__adhoc__",scope.repos,"臨時組");c.classList.add("on");
    c.onclick=()=>openDialog();d.append(c);}
  $("scopename").textContent=scopeLabel();}

function tagColor(t){let i=state.tag_vocab.indexOf(t);if(i<0){i=0;for(const c of t)i=(i*31+c.codePointAt(0))%997;}return TAGCOLORS[i%TAGCOLORS.length];}

// ── 收件匣（統一卡片；key-based diff：輪詢不整塊重繪） ──
const cardEls=new Map();   // key → {el, sig}
let pickerOpen=null;
function allCards(){
  const inScope=new Set(scopeRepos());
  const qs=scan.question_cards.filter(c=>inScope.has(c.repo));
  return qs.concat(state.cards);}
function cardSig(c){return JSON.stringify([c.kind,c.title,c.lines,c.actions&&c.actions.map(a=>a.label),c.due,c.verdict]);}
function buildCard(c){
  const d=el("div","card "+c.kind);d.dataset.key=c.key;
  const ic=el("div","ic");if(c.kind==="pending")ic.append(el("span","spin"));else ic.textContent=KINDICON[c.kind]||"•";d.append(ic);
  const ttl=el("div","ttl");
  if(c.kind==="collision"&&c.verdict){const v=el("span","verdict",c.verdict);
    v.style.color=c.verdict==="真增量"?"var(--green)":c.verdict==="衝突"?"var(--amber)":"var(--sub)";ttl.append(v);}
  if(c.kind==="loop")ttl.append(el("span","muted",c.num+" "));
  ttl.append(document.createTextNode(c.title||""));
  const meta=[];if(c.kind==="loop"&&c.due)meta.push("due "+c.due);if(c.time&&c.kind!=="question")meta.push(c.time);
  if(c.etype)meta.push(c.etype+" ["+c.source+"]");
  if(meta.length)ttl.append(el("span","meta",meta.join("｜")));
  d.append(ttl);
  if(c.lines&&c.lines.length){const ln=el("div","lines");
    c.lines.forEach((l,i)=>{if(i)ln.append(document.createTextNode("\n"));
      const m=l.match(/^([^：]{1,6})：(.*)$/s);
      if(m){ln.append(el("span","k",m[1]+"："));ln.append(document.createTextNode(m[2]));}else ln.append(document.createTextNode(l));});
    d.append(ln);}
  if(c.actions&&c.actions.length){const acts=el("div","acts");
    c.actions.forEach((a,i)=>{const b=el("button",(a.action==="ignore"||a.action==="defer"&&a.label.includes("忽略"))?"quiet":"",a.label);
      if(a.action==="term_create")b.title="開一個有主的 agent 會話（帶料）";
      b.onclick=()=>runAction(c,a,d);acts.append(b);});
    d.append(acts);}
  return d;}
function renderCards(){
  const cards=allCards();
  const wrap=$("cards");
  const byKind={};cards.forEach(c=>(byKind[c.kind]=byKind[c.kind]||[]).push(c));
  // 依 kind 分段，段標題也是 key
  const frag=[];
  KINDORDER.forEach(kind=>{const list=byKind[kind];if(!list||!list.length)return;
    frag.push({key:"sec:"+kind,sec:kind,n:list.length});list.forEach(c=>frag.push(c));});
  // 移除消失的卡（含段標題）——key-based diff，不整塊重繪
  const keys=new Set(frag.map(c=>c.key));
  for(const [k,rec] of cardEls){if(!keys.has(k)){const e=rec.el;cardEls.delete(k);
    if(k.startsWith("sec:"))e.remove();else{e.classList.add("leaving");setTimeout(()=>e.remove(),180);}}}
  let prev=null;
  frag.forEach(item=>{
    let rec=cardEls.get(item.key);
    if(item.sec){const sig="sec"+item.n;
      if(!rec){const e=el("div","secttl",KINDNAME[item.sec]+" ");e.append(el("span","n",String(item.n)));rec={el:e,sig};cardEls.set(item.key,rec);}
      else if(rec.sig!==sig){rec.el.querySelector(".n").textContent=String(item.n);rec.sig=sig;}}
    else{const sig=cardSig(item);
      if(!rec){rec={el:buildCard(item),sig};cardEls.set(item.key,rec);}
      else if(rec.sig!==sig&&pickerOpen!==item.key){const n=buildCard(item);rec.el.replaceWith(n);rec.el=n;rec.sig=sig;}}
    // 排序：確保在 prev 之後
    if(prev?prev.nextSibling!==rec.el:wrap.firstChild!==rec.el)wrap.insertBefore(rec.el,prev?prev.nextSibling:wrap.firstChild);
    prev=rec.el;});
  $("allclear").hidden=cards.length>0;
  const q=scan.quiet;const scoped=scopeRepos().length;
  $("quietline").textContent=scan.states.length?("其餘 "+Math.max(scoped-new Set(allCards().filter(c=>c.repo).map(c=>c.repo)).size,0)+" 個 repo 無異常、無變化。"):"";
  const nInt=cards.filter(c=>c.kind==="interrupt").length;const nAll=cards.filter(c=>c.kind!=="pending"&&c.kind!=="loop").length;
  const b=$("badge");b.style.display=nAll?"inline-block":"none";b.textContent=nInt?("⚠ "+nInt+"｜待處理 "+nAll):("待處理 "+nAll);
  b.classList.toggle("hot",nInt>0);}

async function runAction(card,a,dom){
  const p=Object.assign({},a.payload||{});
  if(a.action==="collide_prefill"){$("idea").value=p.text||"";$("idea").focus();return;}
  if(a.action==="route_pick"){openPicker(card,dom);return;}
  if(a.action==="term_create"){
    if(p.kind==="agent"){if(!p.group&&!p.repos&&!p.repo)Object.assign(p,scopePayload());p.agent=$("agentsel").value||"claude";}
    await newTerm(p.kind||"shell",p);return;}
  if(a.action==="tier"&&p.tier==="paused"){const rw=prompt("paused 必填復工條件（resume_when）：");if(!rw)return;p.resume_when=rw;}
  try{const r=await api("/api/"+a.action,post(p));
    toast(a.label+"：完成"+(r.file?("（"+r.file.split(/[\\/]/).pop()+"）"):r.until?("（到 "+r.until+"）"):r.due?("（due "+r.due+"）"):""));
  }catch(e){return;}
  if(dom){dom.classList.add("leaving");}
  if(a.action==="tier"||a.action==="defer"||a.action==="remove_repo"){await rescan();}
  await refreshState();}
function openPicker(card,dom){
  if(pickerOpen===card.key){pickerOpen=null;const old=dom.querySelector(".picker");old&&old.remove();return;}
  pickerOpen=card.key;
  const pk=el("div","picker");pk.append(el("span","muted","落到："));
  const sel=document.createElement("select");
  sel.append(new Option("incubator（孵化主題）","incubator"));
  state.groups.forEach(g=>sel.append(new Option("組 "+g.name+" /materials","group:"+g.name)));
  state.repos.forEach(r=>sel.append(new Option(r+" /01_inbox","repo:"+r)));
  pk.append(sel);
  const ok=el("button","","落"); ok.onclick=()=>{pickerOpen=null;runAction(card,{label:"改落點",action:"route_collision",payload:{cid:card.cid,dest:sel.value}},dom);};
  const no=el("button","quiet","取消");no.onclick=()=>{pickerOpen=null;pk.remove();};
  pk.append(ok,no);dom.append(pk);}

const notified=new Set();
function maybeNotify(c){const key=c.key;if(notified.has(key))return;notified.add(key);
  try{if(!("Notification" in window))return;
    if(Notification.permission==="default")Notification.requestPermission();
    if(Notification.permission==="granted")new Notification("需要你看一下（system-unsure）",{body:c.title});}catch(e){}}
function renderState(st){
  state=st;
  const asel=$("agentsel");
  if(st.agents&&asel.options.length!==st.agents.length){const cur=asel.value;asel.innerHTML="";
    st.agents.forEach(a=>asel.append(new Option(a,a)));if(st.agents.includes(cur))asel.value=cur;}
  renderDeck();renderCards();syncTerms(st.terms||[]);renderRecent(st.recent||[]);
  st.cards.filter(c=>c.kind==="interrupt").forEach(maybeNotify);
  const s=st.stats;const have=s.collisions>0||s.spawned>0;
  const line=have?("碰撞 "+s.collisions+"｜回連 "+s.collisions_with_outcome+"｜命中率 "+(s.hit_rate==null?"–":Math.round(s.hit_rate*100)+"%")
    +"｜生出 repo "+s.spawned+"｜存活率 "+(s.survival_rate==null?"–":Math.round(s.survival_rate*100)+"%")):"";
  $("statsline").textContent=line;$("statsraw").textContent=line||"（北極星量測：還沒有碰撞或生出的 repo，累積後才顯示）";
  $("sesscount").textContent=(st.terms||[]).filter(t=>t.alive).length?("會話 "+(st.terms||[]).filter(t=>t.alive).length):"";}

const terms=new Map();let activeSid=null;
function termTheme(){return{background:"#111318",foreground:"#e2e5ea",cursor:"#6fa4e8",selectionBackground:"#33405a"};}
function originLabel(o){if(!o)return "";if(o.startsWith("collision:"))return "碰撞 "+o.slice(10);
  if(o.startsWith("q:"))return "問句";if(o.startsWith("repo:"))return o.slice(5);return o;}
function syncTerms(list){
  list.forEach(s=>{let rec=terms.get(s.sid);if(!rec){terms.set(s.sid,rec={t:null,ws:null,el:null,alive:true,info:s});}rec.info=s;rec.alive=s.alive;});
  for(const [sid,rec] of terms){if(!list.find(s=>s.sid===sid)&&!rec.t){removeTerm(sid);}}
  const box=$("sessions");box.innerHTML="";
  let n=0;
  for(const [sid,rec] of terms){n++;const s=rec.info||{sid,title:sid,alive:rec.alive};
    const row=el("div","srow"+(sid===activeSid?" on":"")+(s.alive?"":" dead"));
    row.append(el("span","dot"));
    const t=el("span","stitle",s.title);t.title=(s.task||s.title)+(s.origin?"\n來源："+originLabel(s.origin):"");row.append(t);
    if(s.origin)row.append(el("span","sorigin",originLabel(s.origin)));
    const x=el("span","x","✕");x.title="結束會話";x.onclick=async e=>{e.stopPropagation();try{await api("/api/term_kill",post({sid}));}catch(err){}removeTerm(sid);};
    row.append(x);row.onclick=()=>selectTerm(sid);box.append(row);}
  $("sessempty").style.display=n?"none":"";
  updateTermBar();}
function updateTermBar(){const rec=activeSid&&terms.get(activeSid);
  $("termtitle").innerHTML="";
  if(rec){const s=rec.info||{};const b=el("b",null,s.title||activeSid);$("termtitle").append(b);
    if(s.origin)$("termtitle").append(document.createTextNode("　來源："+originLabel(s.origin)));
    if(s.scope)$("termtitle").append(document.createTextNode("　範圍："+s.scope));}
  $("termkill").disabled=!rec;}
function removeTerm(sid){const rec=terms.get(sid);if(!rec)return;
  if(rec.el)rec.el.remove();if(rec.ws)try{rec.ws.close();}catch(e){}terms.delete(sid);
  if(activeSid===sid){activeSid=null;const first=terms.keys().next();
    if(!first.done)selectTerm(first.value);else{$("termempty").style.display="";updateTermBar();}}
  syncTerms(state.terms.filter(s=>s.sid!==sid));}
function selectTerm(sid){const rec=terms.get(sid);if(!rec)return;
  activeSid=sid;$("termempty").style.display="none";
  for(const [id,r] of terms)if(r.el)r.el.classList.toggle("on",id===sid);
  if(collapsed)toggleTerm();
  if(!rec.t)attachTerm(sid);else setTimeout(()=>{fitTerm(rec);rec.t.focus();},0);
  syncTerms(state.terms);}
function attachTerm(sid){const rec=terms.get(sid);
  const host=el("div","termhost on");$("termbody").append(host);
  const t=new Terminal({fontSize:12.5,fontFamily:"Cascadia Code,Consolas,Menlo,monospace",theme:termTheme(),cursorBlink:true,scrollback:5000});
  const fit=new FitAddon.FitAddon();t.loadAddon(fit);t.open(host);
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/term/"+sid+"?token="+TOKEN);
  ws.binaryType="arraybuffer";ws.onmessage=e=>t.write(new Uint8Array(e.data));
  ws.onclose=()=>{try{t.write("\r\n\x1b[2m[連線已斷——點會話重連]\x1b[0m\r\n");}catch(err){}rec.t=null;rec.ws=null;host.remove();rec.el=null;};
  t.onData(d=>{if(ws.readyState===1)ws.send(JSON.stringify({t:"i",d}));});
  t.onResize(({cols,rows})=>{if(ws.readyState===1)ws.send(JSON.stringify({t:"r",c:cols,r:rows}));});
  ws.onopen=()=>{fitTerm({t,fit});t.focus();};
  Object.assign(rec,{t,fit,ws,el:host});
  for(const [id,r] of terms)if(r.el)r.el.classList.toggle("on",id===sid);}
function fitTerm(rec){try{rec.fit&&rec.fit.fit();}catch(e){}}
function fitAll(){for(const r of terms.values())if(r.t)fitTerm(r);}
async function newTerm(kind,extra){
  const payload=Object.assign({kind},kind==="agent"?scopePayload():{},extra||{});
  if(kind==="agent"&&!payload.agent)payload.agent=$("agentsel").value||"claude";
  const r=await api("/api/term_create",post(payload));
  await refreshState();selectTerm(r.sid);
  toast(kind==="agent"?(payload.agent+" 會話已開：「"+r.title+"」"):"shell 已開");}
$("newshell").onclick=()=>newTerm("shell",{});
$("newagent").onclick=()=>newTerm("agent",{origin:"scope"});
$("termkill").onclick=async()=>{if(!activeSid)return;const sid=activeSid;try{await api("/api/term_kill",post({sid}));}catch(e){}removeTerm(sid);};

// 終端高度：拖曳＋收合
let dragging=false,lastH=260,collapsed=false;
$("termdrag").onmousedown=e=>{dragging=true;e.preventDefault();};
window.addEventListener("mousemove",e=>{if(!dragging)return;
  const h=Math.min(Math.max(window.innerHeight-e.clientY-24,40),window.innerHeight-220);
  collapsed=false;$("termtoggle").textContent="收合";
  document.documentElement.style.setProperty("--termh",h+"px");fitAll();});
window.addEventListener("mouseup",()=>{if(dragging){dragging=false;fitAll();}});
function toggleTerm(){const cur=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--termh"))||260;
  if(collapsed){document.documentElement.style.setProperty("--termh",lastH+"px");collapsed=false;$("termtoggle").textContent="收合";}
  else{lastH=cur;document.documentElement.style.setProperty("--termh","40px");collapsed=true;$("termtoggle").textContent="展開";}
  fitAll();}
$("termtoggle").onclick=toggleTerm;
window.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="`"){e.preventDefault();toggleTerm();}});
window.addEventListener("resize",fitAll);

// 開頁：沒有選中的會話就先收合終端，把高度讓給收件匣；選會話時自動展開
if(!activeSid)toggleTerm();
// 截圖／除錯用 hash：#deep 直接開深看、#adhoc 直接開臨時組對話框
window.addEventListener("load",()=>{
  if(location.hash==="#deep")document.querySelector('#tabs button[data-tab="deep"]').click();
  if(location.hash==="#adhoc")setTimeout(openDialog,600);});
(async()=>{await refreshState();rescan();})();
setInterval(refreshState,5000);   // 殼只 poll 脊椎：輕量輪詢
setInterval(rescan,120000);       // P3 採集低頻；手動按鈕隨時可補
</script></body></html>
